name: policy-jit-db-access
description: Create OPA/Rego policy for JIT database access with Zero Trust controls
prompt: |
  Write an OPA/Rego policy for just-in-time (JIT) database access with the following requirements:
  - Only engineers in the "on-call" group can access production databases
  - Access only allowed during their on-call shift (defined in user.on_call_start/end timestamps)
  - MFA must be verified within the last hour (push or FIDO2)
  - Device must be managed, encrypted, and have EDR running
  - Access must be from corporate network or approved country (US, CA, GB, DE)
  - All access must be logged with full context
  - Deny access if user risk score > 70 or device risk score > 60
  - Include test cases for: on-call engineer with compliant device, off-call engineer, non-engineer, non-compliant device, missing MFA, high risk score

  Use the OPA/Rego template from the skill as a starting point.
expected_outputs:
  - policy.rego
  - policy_test.rego
  - test_input_oncall.json
  - test_input_offcall.json
  - test_input_nonengineer.json
  - test_input_noncompliant_device.json
  - test_input_no_mfa.json
  - test_input_high_risk.json
success_criteria:
  - Policy uses default allow = false (or := in Rego v1)
  - Policy checks all required conditions (role, time, MFA, device, network, risk)
  - Policy includes explicit deny rules with reasons
  - Policy includes obligations (audit logging)
  - Test file includes all 6 test cases
  - All positive test cases pass (allow = true)
  - All negative test cases pass (allow = false)
  - Policy follows NIST 800-207 tenets 3, 4, 6
  - Code is well-commented and uses helper rules